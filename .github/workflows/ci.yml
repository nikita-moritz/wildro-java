name: CI

# The gate: both Spring services against a real PostGIS, and the frontend.
# In the working repository the same jobs gate a deploy job on a self-hosted
# runner; it is left out here, because a public repository must never route a
# stranger's pull request to a machine that runs production.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.service }}
    # GitHub-hosted on purpose. The gate must not depend on our own box being
    # up, and the tests need a throwaway Docker daemon rather than the one the
    # live services run on.
    runs-on: ubuntu-latest
    # One leg per Spring service; a red leg fails the job.
    strategy:
      fail-fast: false
      matrix:
        service: [event-service, analytics-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Pulled here rather than inside the test run so that a registry problem
      # reads as a registry problem instead of a flaky test.
      - name: Pull the pinned database image
        run: docker pull postgis/postgis:17-3.5

      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Built with no EVENT_SERVICE_URL on purpose: every page reads the service
      # at request time, and a build that quietly needed it would pass here only
      # by accident, then break the first time the service is down during a deploy.
      - name: Build without the event service
        run: bun run build
        env:
          SITE_URL: https://java.wildro.app
