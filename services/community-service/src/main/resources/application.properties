spring.application.name=community-service

server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}

# The datasource arrives as SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

# elvix JWTs, as in the user and event services. The audience is our clientId,
# the whole tenant boundary; no default on purpose.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://elvix.is
spring.security.oauth2.resourceserver.jwt.audiences=${ELVIX_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# Who the person is and whether they accepted the terms: the user service,
# asked with the person's own token. Its outbox (user.erased) is pulled from the
# same address with the shared internal token.
wildro.users.base-url=${USER_SERVICE_URL:}
wildro.internal-token=${INTERNAL_TOKEN:}
wildro.consumer.delay=PT30S
wildro.consumer.initial-delay=PT20S

# SPEC.md §18.3: one person owns at most three communities.
wildro.communities.owned-at-most=3

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.environment=${APP_ENVIRONMENT:local}
info.app.revision=${APP_REVISION:unknown}

# The frontend's revalidation endpoint, called after a change this service made
# on its own (an outbox entry it consumed). Blank: renders expire by themselves.
wildro.frontend.revalidate-url=${REVALIDATE_URL:}
wildro.frontend.revalidate-secret=${REVALIDATE_SECRET:}
