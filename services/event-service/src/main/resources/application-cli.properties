# One admin command, not a server.
#
# Migrations belong to the deploy, which runs them when the service starts. A
# command that migrated on its own could move the schema under a running
# service. ddl-auto=validate still refuses to run against a schema that does not
# match this jar.
spring.flyway.enabled=false

spring.main.banner-mode=off
spring.jpa.show-sql=false
