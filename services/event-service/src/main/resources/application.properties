spring.application.name=event-service

server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}

# The datasource is deliberately absent here. It arrives as SPRING_DATASOURCE_URL /
# _USERNAME / _PASSWORD from the environment, which Spring binds natively, so a
# service with no database configured refuses to start instead of falling back to
# something unintended. Tests get theirs from Testcontainers.

# Flyway owns the schema. Hibernate may only check that the code matches it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Errors in the RFC 9457 shape, so a caller reads a status, a title and a
# detail instead of Boot's default whitelabel body.
spring.mvc.problemdetails.enabled=true

# The read path is the money path, so it is measurable from the first commit.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.environment=${APP_ENVIRONMENT:local}
info.app.revision=${APP_REVISION:unknown}

# Stage two (SPEC.md §18.2). Tokens are elvix JWTs; the audience is our clientId
# and is checked in SecurityConfiguration, which refuses every token while it
# is blank, so the command line and the read path run without it.
elvix.issuer=https://elvix.is
elvix.client-id=${ELVIX_CLIENT_ID:}

# The user service answers who the writer is and whether they accepted the
# current terms. Blank: nobody can write, reading is untouched.
wildro.users.base-url=${USER_SERVICE_URL:}

# Limits against spam (SPEC.md §18.2), changeable without touching the rules.
wildro.own.published-per-day=5
wildro.own.upcoming-at-once=30
wildro.reports.per-hour-per-address=5
