spring.application.name=user-service

server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}

# The datasource arrives as SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD from
# the environment, as in the other services: no database configured, no start.
spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

# Tokens are elvix's JWTs, minted by POST /api/v1/token from the session the
# frontend holds. Discovery and key rotation come from the issuer; the audience
# is our clientId and is the whole tenant boundary: one issuer serves every
# elvix application, so without it a token minted for someone else's app would
# pass. The clientId has no default on purpose.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://elvix.is
spring.security.oauth2.resourceserver.jwt.audiences=${ELVIX_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=roles
spring.security.oauth2.resourceserver.jwt.authority-prefix=ROLE_

# The management API, read by subject when a person first arrives, and the
# webhook secret elvix signs deliveries with. Blank secret: every delivery is
# refused, fail closed.
elvix.base-url=https://elvix.is
elvix.application-id=${ELVIX_APP_ID:}
elvix.api-key=${ELVIX_API_KEY:}
elvix.webhook-secret=${ELVIX_WEBHOOK_SECRET:}
elvix.webhook-tolerance=5m

# Shared secret of /internal/** between the services. Blank refuses every call.
wildro.internal-token=${INTERNAL_TOKEN:}

# The version of the platform terms a person must accept before publishing
# (SPEC.md §18.1). Blank while no terms page is published: acceptance is then
# refused rather than recorded against nothing.
wildro.terms.version=${TERMS_VERSION:}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.environment=${APP_ENVIRONMENT:local}
info.app.revision=${APP_REVISION:unknown}
