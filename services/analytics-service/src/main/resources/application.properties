spring.application.name=analytics-service

server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}

# The datasource is deliberately absent here, as in the event service: it
# arrives as SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD from the environment,
# so a service with no database configured refuses to start. Tests get theirs
# from Testcontainers.
spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

# SPEC.md §13. The site host is the only host whose traffic counts; the salt
# feeds the cookieless visitor hash and has no default on purpose: without it
# no hash is written and the visitor metrics are reported as null.
analytics.site-host=${ANALYTICS_SITE_HOST:wildro.app}
analytics.salt=${ANALYTICS_SALT:}
analytics.disabled=${ANALYTICS_DISABLED:false}
analytics.rate-limit-per-minute=60
analytics.retention-months=14

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.environment=${APP_ENVIRONMENT:local}
info.app.revision=${APP_REVISION:unknown}
